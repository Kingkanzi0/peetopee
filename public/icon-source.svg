<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: blue rounded square -->
  <rect width="512" height="512" rx="108" fill="#1A6FE8"/>

  <!-- Stylised P letterform — left vertical bar -->
  <rect x="110" y="128" width="64" height="256" rx="32" fill="white"/>

  <!-- P bowl: right curve top -->
  <path d="M170 128 C310 128 340 160 340 216 C340 272 310 296 170 296" stroke="white" stroke-width="64" stroke-linecap="round" fill="none"/>

  <!-- Dollar coin circle — positioned inside the P bowl -->
  <circle cx="304" cy="212" r="62" fill="#F5A623"/>
  <circle cx="304" cy="212" r="50" fill="#F0A020"/>

  <!-- Dollar sign $ inside coin -->
  <text x="304" y="228" text-anchor="middle" fill="white" font-size="52" font-family="Arial, sans-serif" font-weight="900">$</text>

  <!-- Upward arrow — emerges from top-right of coin -->
  <line x1="340" y1="170" x2="390" y2="112" stroke="white" stroke-width="18" stroke-linecap="round"/>
  <polygon points="390,112 366,118 384,136" fill="white"/>
</svg>
