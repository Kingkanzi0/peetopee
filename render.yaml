# Peetopee on Render — ONE web service that serves the app and its API at the same address.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: peetopee
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE PLAN (testing): Render's free plan can't keep files, so accounts, Peetopee IDs,
    # ID checks and trade bank details are wiped whenever the service sleeps (after 15 idle
    # minutes) or restarts. Wallets and USDC are NOT affected — they live on each phone and
    # on Arc. To keep data, switch to `plan: starter` (paid) and add back:
    #   disk:
    #     name: peetopee-data
    #     mountPath: /app/data
    #     sizeGB: 1
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /app/data/peetopee.db
      # TESTNET SETTINGS — change both before real users join:
      #  OTP_DEMO=1 shows the sign-in code in the app instead of emailing it.
      #  Set RESEND_API_KEY (and OTP_FROM_EMAIL) and remove OTP_DEMO to email real codes.
      - key: OTP_DEMO
        value: "1"
      #  KYC_AUTO_APPROVE=1 approves every ID submission automatically.
      #  Remove it to review submissions yourself on the admin page (#admin).
      - key: KYC_AUTO_APPROVE
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      # Naira account (testnet): bank and bill payouts are marked paid at once — no money moves.
      # Use "manual" when a real payment partner / operator pays them from #admin → Naira.
      - key: PAYOUT_MODE
        value: simulate
      # Naira contract. The admin page (#admin → Naira) deploys it and switches it on, but the
      # free plan forgets that on restart — paste the address here to make it stick.
      # - key: NAIRA_ADDRESS
      #   value: "0x..."
      # Escrow contract the server checks trades against. Leave unset for V1;
      # after deploying PeetopeeEscrowV2, set ESCROW_ADDRESS to its address here.
      # - key: ESCROW_ADDRESS
      #   value: "0x..."
      # Secret for the ID review page. Render generates it; copy it from the dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
