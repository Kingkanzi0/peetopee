services:
  - type: web
    name: peetopee-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 7860
      - key: DB_PATH
        value: /app/data/peetopee.db
    disk:
      name: peetopee-data
      mountPath: /app/data
      sizeGB: 1
